[package]
name = "devizee-all-in-one-download-manager"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "devizee-all-in-one-download-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devizee_all_in_one_download_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "devizee-all-in-one-download-manager"
path = "src/main.rs"

[[bin]]
name = "devizee_host"
path = "src/bin/devizee_host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tokio = { version = "1", features = ["sync"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled"] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_JobObjects",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
