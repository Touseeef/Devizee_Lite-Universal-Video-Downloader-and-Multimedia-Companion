name: "Release Build"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      # ─── Sidecar binaries ───
      # tauri.conf.json declares yt-dlp and ffmpeg as externalBin
      # dependencies. The binaries are ~50 MB each and are gitignored,
      # so CI must download them before `tauri build` runs.
      - name: Prepare sidecar binaries directory
        run: mkdir -p src-tauri/bin
        shell: bash

      - name: Download yt-dlp
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe"
          Get-Item "src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe" | Select-Object Name, Length

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $zip = "ffmpeg-release-essentials.zip"
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/$zip" `
            -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath ffmpeg-temp -Force
          $exe = Get-ChildItem -Path ffmpeg-temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in archive" }
          Copy-Item $exe.FullName "src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe"
          Get-Item "src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe" | Select-Object Name, Length
          Remove-Item -Recurse -Force $zip, ffmpeg-temp

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Devizee Lite v__VERSION__"
          releaseBody: "See release assets below."
          releaseDraft: false
          prerelease: false